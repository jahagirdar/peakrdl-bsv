name: ci

on:
  push:
  pull_request:
    branches:
    - main

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch all tags
      run: git fetch --depth=1 --tags --force

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: "3.10"

    - name: Resolving dependencies
      run: pdm lock -v  -G ci-quality

    - name: Install dependencies
      run: pdm install -G ci-quality

    - name: Check if the documentation builds correctly
      run: pdm run duty check-docs

    - name: Check the code quality
      run: pdm run duty check-quality

    - name: Check if the code is correctly typed
      run: pdm run duty check-types

    - name: Check for vulnerabilities in dependencies
      run: pdm run duty check-dependencies

    - name: Check for breaking changes in the API
      run: pdm run duty check-api

  tests:

    strategy:
      max-parallel: 4
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - "3.10"
        - "3.12"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.12' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: ${{ matrix.python-version }}
        allow-python-prereleases: true

    - name: Resolving dependencies
      run: pdm lock -v  -G ci-tests

    - name: Install dependencies
      run: pdm install --no-editable -G ci-tests

    - name: Run the test suite
      run: pdm run duty test
    - name: run peakrdl
      run: pdm run peakrdl bsv tests/test.rdl -o .
    - name: run pytest
      run: pdm run pytest -rP

  tests-bsc-yosys:
    # The plain `tests` job above has no Bluespec compiler or Yosys, so
    # every bsc-elaboration test (tests/systemrdl_features_test.py's
    # test_bsc_elaborates matrix, plus the bsc-based checks in
    # claude1_test.py) silently skips instead of running. This job uses
    # the rtl_unit_docker image, which bundles bsc (via Nix) and Yosys
    # (from the librelane base image), so those tests actually execute.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dyu-copier/rtl_unit_tools:latest
    env:
      # GitHub Actions' runner-internal Node lifecycle hooks (e.g. the
      # post-job "determine container OS" cleanup step) default to Node
      # 24 as of the 2025-09-19 runner change, which fails against this
      # image's Nix-based root (missing libc/interpreter paths a
      # prebuilt glibc Node binary expects). Force the older Node 20
      # runtime for these hooks instead, matching what already worked
      # for this same image in other repos (e.g. hdl_unit) before that
      # runner-side default changed.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Mark workspace as a safe git directory
      # In a container job the checkout is owned by the runner's UID but
      # container processes may run as a different UID (e.g. root); git
      # >=2.35.2's "dubious ownership" check then refuses to run ANY git
      # command here (including the one pdm-backend needs below for SCM
      # version detection), not just a benign warning.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Fetch all tags
      # pyproject.toml derives this package's version from git (SCM) tags;
      # actions/checkout@v4 does a shallow, tag-less clone by default, so
      # `pip install -e .` below fails to resolve a version without this
      # (same fix already used by the `quality` job above).
      run: git fetch --depth=1 --tags --force

    - name: Install this package (editable) and test dependencies
      run: |
        pip install -e .
        pip install pytest pytest-mock

    - name: Clone BlueCheck (needed by tests/formal_regression_test.py)
      run: git clone --depth=1 https://github.com/CTSRD-CHERI/BlueCheck /tmp/BlueCheck

    - name: Point tests/formal_regression_test.py at the BlueCheck checkout
      run: echo "BLUECHECK_DIR=/tmp/BlueCheck" >> "$GITHUB_ENV"

    - name: Run the full test suite (bsc + yosys available)
      run: pytest -rP
