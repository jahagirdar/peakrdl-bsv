name: ci

on:
  push:
  pull_request:
    branches:
    - main

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Fetch all tags
      run: git fetch --depth=1 --tags --force

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: "3.10"

    - name: Resolving dependencies
      run: pdm lock -v  -G ci-quality

    - name: Install dependencies
      run: pdm install -G ci-quality

    - name: Check if the documentation builds correctly
      run: pdm run duty check-docs

    - name: Check the code quality
      run: pdm run duty check-quality

    - name: Check if the code is correctly typed
      run: pdm run duty check-types

    - name: Check for vulnerabilities in dependencies
      run: pdm run duty check-dependencies

    - name: Check for breaking changes in the API
      run: pdm run duty check-api

  tests:

    strategy:
      max-parallel: 4
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - "3.10"
        - "3.12"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.12' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: ${{ matrix.python-version }}
        allow-python-prereleases: true

    - name: Resolving dependencies
      run: pdm lock -v  -G ci-tests

    - name: Install dependencies
      run: pdm install --no-editable -G ci-tests

    - name: Run the test suite
      run: pdm run duty test
    - name: run peakrdl
      run: pdm run peakrdl bsv tests/test.rdl -o .
    - name: run pytest
      run: pdm run pytest -rP

  tests-bsc-yosys:
    # The plain `tests` job above has no Bluespec compiler or Yosys, so
    # every bsc-elaboration test (tests/systemrdl_features_test.py's
    # test_bsc_elaborates matrix, plus the bsc-based checks in
    # claude1_test.py) silently skips instead of running. This job uses
    # the rtl_unit_docker image, which bundles bsc (via Nix) and Yosys
    # (from the librelane base image), so those tests actually execute.
    #
    # Deliberately NOT using the `container:` job directive: that makes
    # GitHub Actions run its OWN runner-core lifecycle hooks (checkout,
    # the post-job "determine container OS" cleanup step) *inside* this
    # image via `docker exec`, which fails repeatedly against its
    # Nix-based root (missing /lib64/ld-linux-x86-64.so.2, missing/
    # mismatched libstdc++, git's dubious-ownership check, etc. -- see
    # this job's git history for the full saga trying to patch the
    # image to tolerate this). Running on the plain runner and invoking
    # `docker run` ourselves sidesteps the whole problem class: GitHub's
    # own hooks only ever run on the normal ubuntu-latest runner (full
    # Node/glibc support natively); only our own commands run inside
    # the Nix container.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Fetch all tags
      # pyproject.toml derives this package's version from git (SCM) tags;
      # actions/checkout@v7 does a shallow, tag-less clone by default, so
      # `pip install -e .` below fails to resolve a version without this
      # (same fix already used by the `quality` job above).
      run: git fetch --depth=1 --tags --force

    - name: Run the full test suite inside rtl_unit_docker (bsc + yosys available)
      run: |
        docker run --rm -v "$PWD:/work" -w /work \
          ghcr.io/dyu-copier/rtl_unit_tools:latest bash -c '
            set -euo pipefail
            # Bind-mounted files are owned by the host runner UID, not
            # whatever this container runs as -- same dubious-ownership
            # concern as before, just against a plain bind mount now
            # instead of a GitHub-managed container checkout.
            git config --global --add safe.directory /work
            pip install -e .
            pip install pytest pytest-mock
            git clone --depth=1 https://github.com/CTSRD-CHERI/BlueCheck /tmp/BlueCheck
            BLUECHECK_DIR=/tmp/BlueCheck pytest -rP
          '
